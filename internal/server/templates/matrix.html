<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>matrix - yard</title>
<style>
html, body { margin: 0; height: 100%; background: #141a17; overflow: hidden; }
canvas { display: block; width: 100vw; height: 100vh; }
{{- if .Login}}
#login { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
#login form {
  margin: 0; padding: 26px 30px 24px; width: min(380px, 86vw);
  background: rgba(10, 16, 12, 0.72); border: 1px solid rgba(110, 255, 150, 0.35); border-radius: 6px;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.4), 0 0 40px rgba(60, 255, 120, 0.18), inset 0 0 30px rgba(60, 255, 120, 0.06);
  backdrop-filter: blur(3px);
  font: 15px/1.4 ui-monospace, "Cascadia Mono", Consolas, monospace; color: #b8ffc8;
  opacity: 0; transform: translateY(14px) scale(0.96); filter: blur(4px);
  transition: opacity .35s ease, transform .35s ease, filter .35s ease;
}
#login.on { pointer-events: auto; }
#login.on form { opacity: 1; transform: none; filter: none; }
#login.done form { opacity: 0; transform: scale(1.04); filter: blur(6px); transition-duration: .5s; }
#login .brand { font-weight: 700; letter-spacing: .3em; color: #eaffea; text-shadow: 0 0 8px rgba(125, 255, 154, 0.7); margin-bottom: 16px; }
#login label { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid rgba(110, 255, 150, 0.4); padding-bottom: 6px; font-size: 24px; }
#login label::before { content: ">"; color: #7dff9a; }
/* The real input is invisible; .mask draws it with "*" (browsers only offer "•" for password fields). */
#login .field { position: relative; flex: 1; min-width: 0; height: 1.4em; }
#login input {
  position: absolute; inset: 0; width: 100%; padding: 0; border: none; outline: none; background: transparent;
  font: inherit; opacity: 0;
}
#login .mask { display: block; overflow: hidden; white-space: pre; color: #eaffea; letter-spacing: .12em; line-height: 1.4em; text-shadow: 0 0 6px rgba(125, 255, 154, 0.45); }
#login .caret { display: inline-block; width: .5em; height: 1.05em; margin-right: -.5em; vertical-align: -.15em;
                background: #7dff9a; box-shadow: 0 0 8px rgba(125, 255, 154, 0.8); visibility: hidden; }
#login input:focus + .mask .caret { visibility: visible; animation: blink 1s steps(1) infinite; }
#login input:disabled + .mask { opacity: .5; }
@keyframes blink { 50% { visibility: hidden; } }
#login .err { height: 1.4em; margin-top: 8px; font-size: 12px; color: #ff8f8f; }
#login.bad form { animation: shake .4s; }
@keyframes shake {
  20%, 60% { transform: translateX(-8px); }
  40%, 80% { transform: translateX(8px); }
}
{{- end}}
</style>
</head>
<body>
<canvas id="rain"></canvas>
{{- if .Login}}
<div id="login">
  <form>
    <div class="brand">YARD</div>
    <label><span class="field"><input type="password" name="password" autocomplete="current-password" spellcheck="false" aria-label="Password"><span class="mask" aria-hidden="true"><span class="before"></span><span class="caret"></span><span class="after"></span></span></span></label>
    <div class="err"></div>
  </form>
</div>
<script>
(() => {
  const box = document.getElementById("login"), form = box.querySelector("form"),
        input = form.querySelector("input"), err = form.querySelector(".err"),
        shown = form.querySelector(".mask"), caret = form.querySelector(".caret"),
        before = form.querySelector(".before"), after = form.querySelector(".after");
  const next = {{.Next}};

  // Draw the value as "*" with the caret where the real one is.
  const mask = () => {
    const n = [...input.value].length, at = [...input.value.slice(0, input.selectionStart ?? n)].length;
    before.textContent = "*".repeat(at);
    after.textContent = "*".repeat(n - at);
    // Keep the caret in view when the value is longer than the box.
    const x = caret.offsetLeft - shown.offsetLeft, w = shown.clientWidth;
    if (x < shown.scrollLeft) shown.scrollLeft = x;
    else if (x + caret.offsetWidth > shown.scrollLeft + w) shown.scrollLeft = x + caret.offsetWidth - w;
  };
  for (const ev of ["input", "keyup", "select", "focus", "click"]) input.addEventListener(ev, mask);
  document.addEventListener("selectionchange", mask);

  const show = () => {
    if (box.classList.contains("on")) return;
    box.classList.add("on");
    input.focus();
  };
  const hide = () => {
    box.classList.remove("on", "bad");
    input.value = "";
    mask();
    err.textContent = "";
    input.blur();
  };

  addEventListener("click", e => { if (!form.contains(e.target)) box.classList.contains("on") ? hide() : show(); });
  addEventListener("keydown", e => {
    if (e.key === "Escape") hide();
    else if (!box.classList.contains("on") && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); show(); }
  });
  form.addEventListener("animationend", () => box.classList.remove("bad"));

  form.addEventListener("submit", async e => {
    e.preventDefault();
    if (input.disabled || input.value === "") return;
    input.disabled = true;
    err.textContent = "";
    try {
      const res = await fetch({{admin}} + "/login", { method: "POST", body: new URLSearchParams({ password: input.value }) });
      if (res.ok) {
        box.classList.add("done");
        setTimeout(() => location.replace(next), 450);
        return;
      }
      let msg = res.statusText;
      try { msg = (await res.json()).error || msg; } catch (_) {}
      err.textContent = msg;
      box.classList.add("bad");
      input.value = "";
      mask();
    } catch (ex) {
      err.textContent = String(ex);
    }
    input.disabled = false;
    input.focus();
  });
})();
</script>
{{- end}}
<script>
(() => {
  const SIZE = 18;      // cell size in CSS pixels
  const LEVELS = 24;    // brightness steps of the trail (plus one for the head)
  const FLICKER = 1.5;  // glyph changes per lit cell per second (roughly)
  const BG = "#141a17"; // background (keep in sync with the CSS)
  const ALPHA = 0.6;    // glyph opacity

  // Half-width katakana (drawn mirrored) followed by digits and a few symbols.
  const glyphs = [];
  for (let c = 0xFF66; c <= 0xFF9D; c++) glyphs.push(String.fromCharCode(c));
  const kana = glyphs.length;
  for (const ch of "0123456789Z:.=*+-<>|") glyphs.push(ch);

  const canvas = document.getElementById("rain");
  const ctx = canvas.getContext("2d");
  let dpr = 0, px, cols, rows, atlas, bright, decay, glyph, head, streams;

  // Pre-render every glyph at every brightness into one sheet, so a frame is just drawImage calls.
  const buildAtlas = () => {
    atlas = document.createElement("canvas");
    atlas.width = glyphs.length * px;
    atlas.height = (LEVELS + 1) * px;
    const a = atlas.getContext("2d");
    a.font = `${Math.round(px * 0.92)}px "MS Gothic", "Hiragino Kaku Gothic ProN", "Noto Sans Mono CJK JP", monospace`;
    a.textAlign = "center";
    a.textBaseline = "middle";
    for (let l = 0; l <= LEVELS; l++) {
      if (l === LEVELS) {
        a.fillStyle = "#eaffea";
        a.shadowColor = "#7dff9a";
        a.shadowBlur = px * 0.35;
      } else {
        const t = (l + 1) / LEVELS;
        // Fade by transparency rather than by darkening, so it works on any background.
        a.fillStyle = `rgba(${Math.round(20 + 30 * t * t)}, ${Math.round(180 + 75 * t)}, ${Math.round(60 + 30 * t)}, ${Math.pow(t, 1.2).toFixed(3)})`;
        a.shadowBlur = 0;
      }
      glyphs.forEach((g, i) => {
        a.save();
        a.translate(i * px + px / 2, l * px + px / 2);
        if (i < kana) a.scale(-1, 1);
        a.fillText(g, 0, 0);
        a.restore();
      });
    }
  };

  const rand = (lo, hi) => lo + Math.random() * (hi - lo);

  const spawn = (s, initial) => {
    s.speed = rand(6, 22);                       // rows per second
    s.len = Math.round(rand(6, Math.max(8, rows * 0.9)));
    s.y = initial ? rand(-rows, rows) : -rand(0, rows * 0.6);
    return s;
  };

  const resize = () => {
    const d = window.devicePixelRatio || 1;
    if (d !== dpr) { dpr = d; px = Math.round(SIZE * dpr); buildAtlas(); }
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
    cols = Math.ceil(canvas.width / px);
    rows = Math.ceil(canvas.height / px);
    const n = cols * rows;
    bright = new Float32Array(n);
    decay = new Float32Array(n);
    glyph = new Uint8Array(n);
    head = new Uint8Array(n);
    streams = [];
    for (let c = 0; c < cols; c++) {
      streams.push(spawn({ col: c }, true));
      if (Math.random() < 0.35) streams.push(spawn({ col: c }, false));
    }
  };

  const update = dt => {
    const n = bright.length;
    const p = FLICKER * dt;
    for (let i = 0; i < n; i++) {
      head[i] = 0;
      if (bright[i] <= 0) continue;
      bright[i] -= decay[i] * dt;
      if (Math.random() < p) glyph[i] = Math.random() * glyphs.length | 0;
    }
    for (const s of streams) {
      const prev = Math.floor(s.y);
      s.y += s.speed * dt;
      const cur = Math.floor(s.y);
      for (let r = Math.max(prev + 1, 0); r <= cur && r < rows; r++) {
        const i = r * cols + s.col;
        bright[i] = 1;
        decay[i] = s.speed / s.len;
        glyph[i] = Math.random() * glyphs.length | 0;
      }
      if (cur >= 0 && cur < rows) head[cur * cols + s.col] = 1;
      if (s.y - s.len > rows) spawn(s, false);
    }
  };

  const draw = () => {
    ctx.globalAlpha = 1;
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.globalAlpha = ALPHA;
    for (let r = 0, i = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++, i++) {
        const b = bright[i];
        if (b <= 0) continue;
        const l = head[i] ? LEVELS : Math.min(LEVELS - 1, b * LEVELS | 0);
        ctx.drawImage(atlas, glyph[i] * px, l * px, px, px, c * px, r * px, px, px);
      }
    }
  };

  let last = 0;
  const frame = t => {
    const dt = last ? Math.min(0.1, (t - last) / 1000) : 0;
    last = t;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  };

  addEventListener("resize", resize);
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
